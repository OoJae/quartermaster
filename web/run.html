<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Run Card</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151c; --line:#232836; --text:#e7e9ee; --dim:#8b93a7; --ok:#3ddc97; --bad:#ff6b6b; --money:#c3a6ff }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system } .wrap { max-width:980px; margin:0 auto; padding:28px 18px }
  h1 { margin:0 0 4px } .dim { color:var(--dim) } .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px }
  .row { display:grid; grid-template-columns:200px 1fr; gap:8px; padding:4px 0 } .ok { color:var(--ok) } .bad { color:var(--bad) } .money { color:var(--money); font-weight:700 }
  pre { white-space:pre-wrap; word-break:break-word; font:12px/1.45 ui-monospace,Menlo,monospace; margin:0 } .ev { border-bottom:1px dashed #1c2131; padding:6px 0 }
</style>
</head>
<body>
<div class="wrap">
  <h1>Run Card</h1>
  <div class="dim" id="sub">loading…</div>
  <div class="card" id="summary"></div>
  <div class="card" id="rv"><b>Don't trust us: re-verify.</b> <span class="dim">Re-runs the hidden checks on the exact paid build in a fresh fork of the sealed base and compares the deterministic checks hash.</span><br><br><button id="rvbtn" style="background:#7c9cff;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer">Re-verify this build</button> <span id="rvout" class="dim"></span></div>
  <div class="card"><b>Events</b> <span class="dim">(each event's hash covers the previous one; edit any line and the chain breaks)</span><div id="events"></div></div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const job = qs.get("job") || location.pathname.split("/").pop();
async function sha256(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join(""); }
(async () => {
  const src = location.pathname.startsWith("/run/") ? ("/api/runs/" + job) : ("runs/" + job + ".json");
  const data = await (await fetch(src)).json();
  const evs = data.events;
  let prev = "genesis", broken = -1;
  for (let i = 0; i < evs.length; i++) { const { hash, ...body } = evs[i]; if (body.prev !== prev || (await sha256(JSON.stringify(body))) !== hash) { broken = i; break; } prev = hash; }
  const get = (k) => evs.find((e) => e.kind === k)?.data || {};
  const auth = get("stripe.authorized"), cap = get("stripe.captured"), rel = get("stripe.released"), ver = get("verifier.verdict"), start = get("job.start"), probe = get("perimeter.probe");
  document.getElementById("sub").textContent = `${data.job} · ${evs.length} events · head ${evs.at(-1)?.hash.slice(0, 16)}`;
  const rows = [
    ["Hash chain", broken === -1 ? '<span class="ok">intact (verified in your browser)</span>' : `<span class="bad">BROKEN at event ${broken}</span>`],
    ["Pinned before work", `grader pack <code>${(start.pins?.grader_pack_sha256 || "").slice(0, 16)}</code> · task <code>${(start.pins?.task_sha256 || "").slice(0, 16)}</code> · policy <code>${(start.pins?.policy_sha256 || "").slice(0, 16)}</code>`],
    ["Perimeter", probe.verdict ? `${probe.verdict} · keys in agent env: ${probe.real_keys_in_env} · internet: ${probe.internet === "200" ? "open" : "blocked"}` : "–"],
    ["Checks hash", ver.critical ? `<code>${ver.checksSha256 || "(computed on re-verify)"}</code>` : "–"],
    ["Hidden checks", ver.critical ? `critical ${ver.criticalPass ? '<span class="ok">pass</span>' : '<span class="bad">fail</span>'} · normal ${ver.normalPassed}/${ver.normalTotal} · verdict <code>${(ver.verdictSha256 || "").slice(0, 16)}</code>` : "–"],
    ["Payment", cap.paymentIntent ? `<span class="money">$${(cap.amount_received / 100).toFixed(2)} captured</span> of $${(cap.of / 100).toFixed(2)} · ${cap.paymentIntent}` : rel.paymentIntent ? `<span class="money">$0</span> · hold released (${rel.reason}) · ${rel.paymentIntent}` : auth.paymentIntent ? `held · ${auth.paymentIntent}` : "–"],
  ];
  document.getElementById("summary").innerHTML = rows.map(([k, v]) => `<div class="row"><div class="dim">${k}</div><div>${v}</div></div>`).join("");
  const btn = document.getElementById("rvbtn"), out = document.getElementById("rvout");
  if (!location.pathname.startsWith("/run/")) { btn.disabled = true; out.innerHTML = 'Run locally: <code>pnpm tsx src/reverify.ts ' + data.job + '</code>'; }
  btn.onclick = async () => { btn.disabled = true; out.textContent = "forking the sealed base and re-running the hidden checks…"; const r = await (await fetch("/api/reverify/" + data.job, { method: "POST" })).json(); out.innerHTML = r.error ? `<span class="bad">${r.error}</span>` : (r.reproduced ? `<span class="ok">REPRODUCED</span>` : `<span class="bad">MISMATCH</span>`) + ` · original <code>${r.want.slice(0,16)}</code> · re-run <code>${r.got.slice(0,16)}</code> · <a href="/run/${r.card}">re-verify run card</a>`; btn.disabled = false; };
  document.getElementById("events").innerHTML = evs.map((e) => `<div class="ev"><b>#${e.seq} ${e.kind}</b> <span class="dim">${e.ts}</span><pre>${JSON.stringify(e.data, null, 1).slice(0, 1200).replace(/</g, "&lt;")}</pre></div>`).join("");
})();
</script>
</body>
</html>
